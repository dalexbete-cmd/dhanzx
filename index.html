<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHANZX PANEL</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #0a0015, black);
    font-family: Arial, sans-serif;
    color: white;
}

.header {
    text-align: center;
    margin-top: 20px;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff00ff, 0 0 20px #cc00ff;
}

.panel {
    width: 90%;
    max-width: 360px;
    margin: 15px auto;
    padding: 15px;
    border: 2px solid #ff00ff;
    border-radius: 15px;
    background: linear-gradient(145deg, black, #1a001f);
    box-shadow: 0 0 15px #ff00ff;
}

.input-wrap {
    display: flex;
    border: 1px solid #ff00ff;
    border-radius: 10px;
    padding: 8px;
    background: black;
}

.prefix {
    color: #ff66ff;
    margin-right: 5px;
}

.input-wrap input {
    border: none;
    outline: none;
    background: transparent;
    color: white;
    width: 100%;
}

select {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 12px;
    background: black;
    color: #ff66ff;
    border: 1px solid #ff00ff;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(45deg, #cc00cc, #ff66ff);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.line {
    width: 90%;
    max-width: 360px;
    height: 1px;
    background: #ff00ff;
    margin: 10px auto;
}

/* POPUP */
.popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.popup-box {
    width: 80%;
    max-width: 300px;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid red;
    text-align: center;
    background: linear-gradient(145deg, black, #1a0000);
    box-shadow: 0 0 25px red;
}

/* spinner */
.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #ff6666;
    border-top: 4px solid red;
    border-radius: 50%;
    margin: 10px auto;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* glitch */
.glitch {
    animation: glitch 0.3s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(2px, -2px); }
    60% { transform: translate(-2px, -1px); }
    80% { transform: translate(2px, 1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div class="header">DHANZX BUG ⚡</div>

<div class="panel">
    <div class="input-wrap">
        <div class="prefix">+62</div>
        <input type="tel" placeholder="Masukkan nomor">
    </div>

    <select>
        <option>Crash Biasa</option>
        <option>Crash Lag</option>
        <option>Crash Lag Parah</option>
    </select>

    <button onclick="showPopup()">KIRIM CRASH</button>
</div>

<div class="line"></div>

<div class="panel">
    <div class="input-wrap">
        <div class="prefix">+62</div>
        <input type="tel" placeholder="Masukkan nomor">
    </div>

    <select>
        <option>Blokir 1 Hari</option>
        <option>Blokir 1 Minggu</option>
        <option>Blokir 1 Bulan</option>
        <option>Blokir Permanen</option>
    </select>

    <button onclick="showPopup()">KIRIM BLOKIR</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-box" id="popupBox">

        <div id="popupTitle">⚠️ PROSES DIMUAT ⚠️</div>

        <div class="spinner" id="spinner"></div>

        <div id="popupText">Sedang memproses...</div>

        <button id="popupBtn" onclick="closePopup()" style="display:none;">Tutup</button>

    </div>
</div>

<script>
function showPopup() {
    const input = document.querySelector("input");
    const popup = document.getElementById("popup");
    const title = document.getElementById("popupTitle");
    const text = document.getElementById("popupText");
    const btn = document.getElementById("popupBtn");
    const spinner = document.getElementById("spinner");
    const box = document.getElementById("popupBox");

    popup.style.display = "flex";

    // cek kosong
    if (input.value.trim() === "") {
        spinner.style.display = "none";
        box.classList.remove("glitch");

        title.innerText = "⚠️ ERROR ⚠️";
        text.innerText = "ISI NOMOR TARGET!";
        btn.style.display = "inline-block";

        if (navigator.vibrate) {
            navigator.vibrate([200,100,200]);
        }
        return;
    }

    // proses normal
    spinner.style.display = "block";
    box.classList.remove("glitch");
    btn.style.display = "none";

    title.innerText = "⚠️ PROSES DIMUAT ⚠️";
    text.innerText = "Sedang memproses...";

    let audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();

    if (navigator.vibrate) {
        navigator.vibrate(200);
    }

    setTimeout(() => {
        spinner.style.display = "none";

        title.innerText = "✅ KIRIM BERHASIL";
        text.innerText = "Proses selesai dengan sukses";

        box.classList.add("glitch");

        if (navigator.vibrate) {
            navigator.vibrate([100,100,100]);
        }

        btn.style.display = "inline-block";

    }, 2000);
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
